<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kt-turtlebot3-host lidar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1e;
        color: #e8e8ec;
        font-family: system-ui, sans-serif;
      }
      #wrap {
        --imu-panel-height: 20%;
        --camera-panel-width: min(32.5vw, 350px);
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }
      .upper {
        display: flex;
        flex-direction: row;
        flex: 1;
        min-height: 0;
      }
      .main-column {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      header {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
      }
      #hud {
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
      }
      #main-panel {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        background: #121216;
      }
      #viz {
        flex: 1;
        width: 100%;
        height: 100%;
        display: block;
        min-height: 0;
      }
      #camera-wrap {
        position: absolute;
        top: 0.65rem;
        right: 0.65rem;
        width: min(var(--camera-panel-width), calc(min(27.5vh, 262.5px) * 4 / 3));
        aspect-ratio: 4 / 3;
        z-index: 1;
        background: #111114;
        border: 1px solid #2a2a32;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #camera {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        background: #111114;
        display: block;
      }
      #camera:not([src]) {
        visibility: hidden;
      }
      .legend {
        opacity: 0.85;
      }
      aside#sidebar {
        width: 25%;
        flex-shrink: 0;
        min-width: 12rem;
        border-left: 1px solid #333;
        overflow-y: auto;
        padding: 0.75rem;
        box-sizing: border-box;
        font-size: 0.85rem;
      }
      .sidebar-card {
        background: #121216;
        border: 1px solid #2a2a32;
        border-radius: 6px;
        padding: 0.6rem 0.75rem;
        margin-bottom: 0.75rem;
      }
      .sidebar-card h2 {
        margin: 0 0 0.5rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9a9aa8;
      }
      .sidebar-card.stale {
        opacity: 0.55;
      }
      #imu-panel {
        height: var(--imu-panel-height);
        min-height: 100px;
        flex-shrink: 0;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 0.5rem 0.75rem 0.65rem;
        border-top: 1px solid #333;
        background: #121216;
      }
      #imu-panel h2 {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9a9aa8;
        flex-shrink: 0;
      }
      #imu-traces {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: block;
        background: #0e0e12;
        border-radius: 4px;
      }
      #imu-legend {
        font-family: ui-monospace, monospace;
        font-size: 0.65rem;
        line-height: 1.35;
        margin-top: 0.35rem;
        flex-shrink: 0;
      }
      .battery-bar-wrap {
        height: 8px;
        background: #2a2a32;
        border-radius: 4px;
        overflow: hidden;
        margin: 0.35rem 0;
      }
      .battery-bar {
        height: 100%;
        background: #66bb6a;
        transition: width 0.15s ease;
      }
      .mono {
        font-family: ui-monospace, monospace;
      }
      table.joints-table {
        width: 100%;
        border-collapse: collapse;
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
      }
      table.joints-table th,
      table.joints-table td {
        text-align: left;
        padding: 0.15rem 0.25rem;
        border-bottom: 1px solid #2a2a32;
      }
      details.sensor-raw summary {
        cursor: pointer;
        color: #9a9aa8;
      }
      .vel-row {
        margin-bottom: 0.65rem;
      }
      .vel-row label {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        margin-bottom: 0.25rem;
      }
      .vel-row input[type="range"] {
        width: 100%;
        accent-color: #66bb6a;
      }
      .vel-hint {
        font-size: 0.65rem;
        color: #777;
        line-height: 1.4;
        margin-top: 0.35rem;
      }
      @media (max-width: 900px) {
        #wrap {
          --camera-panel-width: min(50vw, 300px);
        }
        .upper {
          flex-direction: column;
        }
        aside#sidebar {
          width: 100%;
          max-width: none;
          min-width: 0;
          border-left: none;
          border-top: 1px solid #333;
          max-height: 40vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="upper">
        <div class="main-column">
          <header>
            <div id="hud">Connecting…</div>
            <div class="legend">Top-down base_link: +X forward (up), +Y left (right). Points coloured by intensity.</div>
          </header>
          <div id="main-panel">
            <canvas id="viz"></canvas>
            <div id="camera-wrap">
              <img id="camera" alt="" />
            </div>
          </div>
        </div>
        <aside id="sidebar">
          <section id="cmd-vel-card" class="sidebar-card">
            <h2>cmd_vel</h2>
            <div class="vel-row">
              <label><span>linear.x (m/s)</span><span id="linear-val">0.000</span></label>
              <input type="range" id="linear-slider" min="-0.22" max="0.22" step="0.01" value="0" />
            </div>
            <div class="vel-row">
              <label><span>angular.z (rad/s)</span><span id="angular-val">0.000</span></label>
              <input type="range" id="angular-slider" min="-2.84" max="2.84" step="0.05" value="0" />
            </div>
            <p class="vel-hint">
              Drag sliders or use keys: ↑↓/W/S linear, ←→/A/D angular (Shift = fine). Sent at 50 Hz via POST
              <code>/cmd_vel.json</code>.
            </p>
          </section>
          <section id="battery-card" class="sidebar-card stale">
            <h2>Battery</h2>
            <div id="battery-body" class="mono">No data</div>
          </section>
          <section id="joints-card" class="sidebar-card">
            <h2>Wheel joints</h2>
            <div id="joints-body" class="mono">No data</div>
          </section>
          <section id="sensor-card" class="sidebar-card">
            <h2>Sensor state</h2>
            <div id="sensor-body" class="mono">No data</div>
          </section>
        </aside>
      </div>
      <section id="imu-panel">
        <h2>IMU traces</h2>
        <canvas id="imu-traces"></canvas>
        <div id="imu-legend"></div>
      </section>
    </div>
    <script src="/viz.js?v=waffle1"></script>
  </body>
</html>
